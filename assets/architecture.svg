<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'Segoe UI', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B8DEF"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="16" fill="url(#bg)"/>
  <text x="600" y="42" text-anchor="middle" fill="#F1F5F9" font-size="24" font-weight="700">EdgeGate — 嵌入式 Linux 工业数据采集网关 · 总体架构</text>

  <!-- 第 1 层: 云端/PC -->
  <g>
    <rect x="40" y="70" width="1120" height="86" rx="12" fill="#0B1220" stroke="#334155" stroke-width="1.5"/>
    <text x="60" y="98" fill="#94A3B8" font-size="14" font-weight="700">云端 / PC 侧</text>
    <rect x="60" y="106" width="300" height="38" rx="8" fill="#1E3A8A"/>
    <text x="210" y="131" text-anchor="middle" fill="#DBEAFE" font-size="14">Mosquitto MQTT Broker(PC/云)</text>
    <rect x="420" y="106" width="300" height="38" rx="8" fill="#334155"/>
    <text x="570" y="131" text-anchor="middle" fill="#E2E8F0" font-size="14">订阅端: mosquitto_sub / Web / 上位机</text>
    <rect x="780" y="106" width="360" height="38" rx="8" fill="#334155"/>
    <text x="960" y="131" text-anchor="middle" fill="#E2E8F0" font-size="14">运维: nc/telnet → TCP 命令服务器(JSON)</text>
  </g>

  <!-- 第 2 层: 应用与核心 -->
  <g>
    <rect x="40" y="176" width="1120" height="150" rx="12" fill="#0B1220" stroke="#334155" stroke-width="1.5"/>
    <text x="60" y="204" fill="#94A3B8" font-size="14" font-weight="700">边缘网关(IMX6ULL / x86) — 应用与核心层</text>
    <rect x="60" y="214" width="250" height="96" rx="8" fill="#0E7490"/>
    <text x="185" y="240" text-anchor="middle" fill="#CFFAFE" font-size="13" font-weight="700">Gateway 管线</text>
    <text x="185" y="260" text-anchor="middle" fill="#A5F3FC" font-size="11">采集线程(轮询调度)</text>
    <text x="185" y="278" text-anchor="middle" fill="#A5F3FC" font-size="11">遥测线程(聚合/JSONL)</text>
    <text x="185" y="296" text-anchor="middle" fill="#A5F3FC" font-size="11">状态机(生命周期)</text>
    <rect x="330" y="214" width="250" height="96" rx="8" fill="#7C3AED"/>
    <text x="455" y="240" text-anchor="middle" fill="#EDE9FE" font-size="13" font-weight="700">边缘计算</text>
    <text x="455" y="260" text-anchor="middle" fill="#DDD6FE" font-size="11">滑动平均 / 一阶低通滤波</text>
    <text x="455" y="278" text-anchor="middle" fill="#DDD6FE" font-size="11">迟滞告警规则引擎</text>
    <text x="455" y="296" text-anchor="middle" fill="#DDD6FE" font-size="11">数据质量 Good/Bad/Stale</text>
    <rect x="600" y="214" width="250" height="96" rx="8" fill="#334155"/>
    <text x="725" y="240" text-anchor="middle" fill="#E2E8F0" font-size="13" font-weight="700">核心库(core/util)</text>
    <text x="725" y="260" text-anchor="middle" fill="#CBD5E1" font-size="11">环形缓冲(双条件变量)</text>
    <text x="725" y="278" text-anchor="middle" fill="#CBD5E1" font-size="11">事件总线 / 线程 RAII</text>
    <text x="725" y="296" text-anchor="middle" fill="#CBD5E1" font-size="11">手写 JSON / 配置</text>
    <rect x="870" y="214" width="270" height="96" rx="8" fill="#334155"/>
    <text x="1005" y="240" text-anchor="middle" fill="#E2E8F0" font-size="13" font-weight="700">交互</text>
    <text x="1005" y="260" text-anchor="middle" fill="#CBD5E1" font-size="11">CLI 终端(watch 模式)</text>
    <text x="1005" y="278" text-anchor="middle" fill="#CBD5E1" font-size="11">Qt GUI(可选,自绘曲线)</text>
    <text x="1005" y="296" text-anchor="middle" fill="#CBD5E1" font-size="11">命令服务器(单线程 poll)</text>
  </g>

  <!-- 第 3 层: 协议栈 -->
  <g>
    <rect x="40" y="346" width="1120" height="110" rx="12" fill="#0B1220" stroke="#334155" stroke-width="1.5"/>
    <text x="60" y="374" fill="#94A3B8" font-size="14" font-weight="700">协议栈(全部从零实现,零外部依赖)</text>
    <rect x="60" y="386" width="520" height="58" rx="8" fill="#B45309"/>
    <text x="320" y="412" text-anchor="middle" fill="#FEF3C7" font-size="14" font-weight="700">Modbus RTU 主站</text>
    <text x="320" y="432" text-anchor="middle" fill="#FDE68A" font-size="11">CRC16 · 03/04/06/0x10 功能码 · 3.5T 静默切帧 · 超时/异常分类 · 寄存器映射与标度变换</text>
    <rect x="620" y="386" width="520" height="58" rx="8" fill="#0369A1"/>
    <text x="880" y="412" text-anchor="middle" fill="#E0F2FE" font-size="14" font-weight="700">MQTT 3.1.1 客户端</text>
    <text x="880" y="432" text-anchor="middle" fill="#BAE6FD" font-size="11">报文编解码 · QoS0/1 · keepalive+PINGRESP 看门狗 · 指数退避重连 · 订阅重建</text>
  </g>

  <!-- 第 4 层: HAL 与硬件 -->
  <g>
    <rect x="40" y="476" width="1120" height="170" rx="12" fill="#0B1220" stroke="#334155" stroke-width="1.5"/>
    <text x="60" y="504" fill="#94A3B8" font-size="14" font-weight="700">硬件抽象层(HAL)与设备侧</text>
    <rect x="60" y="514" width="340" height="60" rx="8" fill="#065F46"/>
    <text x="230" y="540" text-anchor="middle" fill="#D1FAE5" font-size="13" font-weight="700">PosixSerial(termios raw)</text>
    <text x="230" y="560" text-anchor="middle" fill="#A7F3D0" font-size="11">波特率/8N1 · VMIN/VTIME · poll 毫秒超时 · RS485 ioctl</text>
    <rect x="420" y="514" width="340" height="60" rx="8" fill="#065F46"/>
    <text x="590" y="540" text-anchor="middle" fill="#D1FAE5" font-size="13" font-weight="700">PTY 虚拟串口(演示/测试)</text>
    <text x="590" y="560" text-anchor="middle" fill="#A7F3D0" font-size="11">x86 无硬件闭环: 主站连 master,从站连 slave,真实 termios 时序</text>
    <rect x="60" y="586" width="340" height="48" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="230" y="616" text-anchor="middle" fill="#CBD5E1" font-size="12">RS485 总线(真机: /dev/ttymxc2 / ttyUSB0)</text>
    <rect x="420" y="586" width="340" height="48" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="590" y="616" text-anchor="middle" fill="#CBD5E1" font-size="12">软件从站(寄存器堆+故障注入: crc/no_response/exception)</text>
    <rect x="780" y="514" width="360" height="120" rx="8" fill="#1E293B" stroke="#475569"/>
    <text x="960" y="540" text-anchor="middle" fill="#CBD5E1" font-size="12" font-weight="700">真实仪表/PLC(部署形态)</text>
    <text x="960" y="562" text-anchor="middle" fill="#94A3B8" font-size="11">温压流传感器 · 电表 · 泵阀控制器</text>
    <text x="960" y="582" text-anchor="middle" fill="#94A3B8" font-size="11">寄存器映射: 地址 → 物理量 → 告警阈值</text>
    <text x="960" y="602" text-anchor="middle" fill="#94A3B8" font-size="11">IMX6ULL: 交叉编译 + systemd 部署</text>
    <text x="960" y="622" text-anchor="middle" fill="#94A3B8" font-size="11">板载 LED/蜂鸣器联动(预留)</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#5B8DEF" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M 210 144 L 210 214"/>
    <path d="M 880 144 L 880 214"/>
    <path d="M 320 344 L 320 386"/>
    <path d="M 880 344 L 880 386"/>
    <path d="M 320 444 L 230 514"/>
    <path d="M 320 444 L 590 514"/>
    <path d="M 590 574 L 590 586"/>
    <path d="M 230 574 L 230 586"/>
    <path d="M 320 444 L 960 514" stroke-dasharray="6 4"/>
  </g>

  <text x="600" y="660" text-anchor="middle" fill="#64748B" font-size="12">数据流: RS485 轮询采集 → 边缘滤波/告警 → MQTT 遥测上云 · 反向: TCP 命令/订阅下发 → 寄存器写入</text>
</svg>
